name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests & PostGIS Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: smartroute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Alembic Upgrade Head
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/smartroute_test
        run: |
          cd backend
          python -c "
          import asyncio, asyncpg
          async def create_pytest_db():
              try:
                  conn = await asyncpg.connect('postgresql://test_user:test_password@localhost:5432/smartroute_test')
                  exists = await conn.fetchval(\"SELECT 1 FROM pg_database WHERE datname = 'smartroute_pytest'\")
                  if not exists:
                      await conn.execute('CREATE DATABASE smartroute_pytest')
                  await conn.close()
                  conn_p = await asyncpg.connect('postgresql://test_user:test_password@localhost:5432/smartroute_pytest')
                  await conn_p.execute('CREATE EXTENSION IF NOT EXISTS postgis;')
                  await conn_p.close()
              except Exception as e:
                  print('Notice initializing test database:', e)
          asyncio.run(create_pytest_db())
          "
          alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://test_user:test_password@localhost:5432/smartroute_pytest alembic upgrade head || true

      - name: Run Pytest with Coverage Report
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/smartroute_test
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/smartroute_pytest
          JWT_SECRET: super_insecure_ci_test_secret_32_characters_minimum!
          ENV: development
        run: |
          cd backend
          pytest -v --tb=short --cov=app/services --cov=app/api --cov-report=term-missing --cov-report=xml tests/

  ml:
    name: Machine Learning Model Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run ML Unit Tests
        run: |
          pytest ml/tests/

  frontend:
    name: Frontend Build, Lint, Test & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type Check & Lint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Scan Built Bundle for Secrets
        run: |
          node scripts/check_bundle_secrets.mjs

  security-audit:
    name: Dependency & Static Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Run Python Dependency Audit (pip-audit)
        run: |
          mkdir -p audit-reports
          pip-audit -r backend/requirements.txt > audit-reports/pip-audit.txt 2>&1 || true

      - name: Run Bandit Security Linter
        run: |
          bandit -r backend/app -f txt -o audit-reports/bandit.txt || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run NPM Audit
        run: |
          cd frontend
          npm audit > ../audit-reports/npm-audit.txt 2>&1 || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: audit-reports/
