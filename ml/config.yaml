# Model training configuration
data_source: "kaggle-bangalore-city-traffic"
model_version: "v1.0.0"
data_granularity: "daily"
validation_split_ratio: 0.15 # last 15% of chronological dates for validation
random_seed: 42

features:
  categorical:
    - "area"
    - "weather"
  numeric:
    - "weekday"
    - "is_weekend"
    - "month"
    - "is_holiday"

target_min_clip: 1.00
target_max_clip: 2.00

lightgbm_params:
  objective: "regression"
  metric: "mae"
  boosting_type: "gbdt"
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  verbose: -1
