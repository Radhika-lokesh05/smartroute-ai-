# Render Infrastructure as Code Blueprint for SmartRoute AI
# Platform: Render Cloud (Zero Docker deployment)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ============================================================================
  # 1. Backend Web Service (FastAPI + AsyncPG + Alembic)
  # ============================================================================
  - type: web
    name: smartroute-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: ENV
        value: production
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Secure credentials configured in Render Dashboard (sync: false prevents commiting secrets)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ============================================================================
  # 2. Frontend Static Site (React + Vite + Leaflet)
  # ============================================================================
  - type: web
    name: smartroute-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self' https: wss:; font-src 'self' data:;"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(self)"
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_TILE_URL
        value: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
      - key: VITE_TILE_ATTRIBUTION
        value: "&copy; OpenStreetMap contributors"
